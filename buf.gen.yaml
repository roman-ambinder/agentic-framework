version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/roman-ambinder/agentic-framework/gen/go
plugins:
  - local: ["go", "tool", "-modfile=tooling/go.mod", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tooling/go.mod", "protoc-gen-go-grpc"]
    out: gen/go
    opt: paths=source_relative
clean: true
