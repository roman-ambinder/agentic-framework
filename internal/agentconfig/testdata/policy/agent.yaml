name: inc
version: 1
model: {provider: fake}
tools:
  - server: fs
    command: ["adlc", "tool", "fs", "--root", "./workspace"]
    risk: {read_file: read, list_dir: read, write_file: write_local}
policy:
  default: deny
  include:
    - shared.yaml
  rules:
    - id: reads
      risk: read
      decision: allow
