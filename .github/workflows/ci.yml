name: ci

on:
  push:
    branches: [main, integration]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy check
        run: make tidy-check
      - name: proto lint
        run: make proto-lint
      - name: generated code is up to date
        run: make proto-check
      - name: test
        run: make test-race
      - name: fixtures
        run: make fixtures-test
      - name: build
        run: make build
      - name: smoke test
        run: ./bin/adlc version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        run: make lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: docker tests
        run: make test-docker

  # Fails a pull request that breaks compatibility of the contracts with its base branch.
  proto-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: check out base branch
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add "$RUNNER_TEMP/base" FETCH_HEAD
      - name: buf breaking
        run: |
          if [ -f "$RUNNER_TEMP/base/buf.yaml" ]; then
            make proto-breaking AGAINST="$RUNNER_TEMP/base"
          else
            echo "base branch has no contracts yet; skipping"
          fi
